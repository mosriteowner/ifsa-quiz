<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>#自主基準クイズ（前文）</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:820px;margin:24px auto;padding:0 16px;line-height:1.6}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px 18px;margin:12px 0}
    .muted{color:#666;font-size:0.92em}
    button{padding:10px 12px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;text-align:left;width:100%;margin:6px 0}
    button:hover{background:#f6f6f6}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .smallbtn{width:auto}
    .ok{border-color:#2f855a}
    .ng{border-color:#c53030}

    @media (max-width: 480px) {
      button { font-size: 17px; line-height: 1.4; padding: 12px 10px; }
    }
    @media (pointer: coarse) and (min-width: 768px) {
      button { font-size: 18px; line-height: 1.6; padding: 14px 12px; }
    }

    button:disabled{
      color:#000;
      opacity:1;
      background:#fff;
      border-color:#ccc;
    }

    .modebar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
    .modepill{width:auto}
  </style>
</head>
<body>
  <h1 id="title">#自主基準クイズ（前文）</h1>
  <p class="muted" id="subtitle">学習用クイズ。全8問、1問ずつ進みます。</p>

  <div class="modebar" id="modebar" style="display:none">
    <button class="smallbtn modepill" id="modeLabel" disabled>モード</button>
    <button class="smallbtn modepill" id="modeToggle" type="button">切替</button>
  </div>

  <div id="app" class="card"></div>

  <script>
  const params = new URLSearchParams(location.search);
  // 前文は固定（index_common と同じ階層に置く前提）
  const DATA_URL = "./quiz_preamble_8.json";

  // mode: quiz(既定) / view(read)
  const MODE = (params.get("mode") || "quiz").toLowerCase();
  const IS_VIEW = (MODE === "view" || MODE === "read");

  function setMode(newMode){
    const p = new URLSearchParams(location.search);
    if(newMode){ p.set("mode", newMode); } else { p.delete("mode"); }
    const qs = p.toString();
    location.search = qs ? ("?" + qs) : "";
  }
  function toggleMode(){ setMode(IS_VIEW ? "quiz" : "view"); }

  function updateModeBar(){
    const bar = document.getElementById("modebar");
    const label = document.getElementById("modeLabel");
    const toggle = document.getElementById("modeToggle");
    if(!bar || !label || !toggle) return;
    bar.style.display = "flex";
    label.textContent = IS_VIEW ? "閲覧モード" : "回答モード";
    toggle.textContent = IS_VIEW ? "回答へ切替" : "閲覧へ切替";
    toggle.onclick = toggleMode;
  }

  let quiz = null, idx = 0, correct = 0, answered = false;

  const app = document.getElementById("app");
  const titleEl = document.getElementById("title");
  const subtitleEl = document.getElementById("subtitle");

  function safeText(s){ return String(s ?? ""); }

  /* ===== 選択肢シャッフル（1問につき1回だけ） ===== */
  function shuffleChoices(choices, answerIndex){
    const packed = choices.map((text, i) => ({ text, i }));
    for(let j = packed.length - 1; j > 0; j--){
      const k = Math.floor(Math.random() * (j + 1));
      [packed[j], packed[k]] = [packed[k], packed[j]];
    }
    const newChoices = packed.map(p => p.text);
    const newAnswerIndex = packed.findIndex(p => p.i === answerIndex);
    return { newChoices, newAnswerIndex };
  }
  /* ================================================== */

  function setPageTitle(){
    const qt = (quiz && typeof quiz.title === "string") ? quiz.title.trim() : "";
    if(qt){
      document.title = `#自主基準クイズ（${qt}）`;
      if(titleEl) titleEl.textContent = `#自主基準クイズ（${qt}）`;
      return;
    }
    document.title = "#自主基準クイズ（前文）";
    if(titleEl) titleEl.textContent = "#自主基準クイズ（前文）";
  }

  function setSubtitle(){
    if(!subtitleEl) return;
    subtitleEl.textContent = IS_VIEW
      ? "閲覧モード。必要に応じて正解／解説を表示します。"
      : "回答モード。全8問、1問ずつ進みます。";
  }

  function render(){
    if(!app || !quiz || !quiz.questions) return;

    const q = quiz.questions[idx];
    app.innerHTML = "";

    if(!q){
      if(IS_VIEW){
        app.innerHTML = `
          <div>
            <h2>最後まで到達</h2>
            <div class="row">
              <button class="smallbtn" onclick="restart()">最初へ</button>
              <button class="smallbtn" onclick="prev()">前へ</button>
            </div>
          </div>
        `;
        return;
      }
      const rate = Math.round((correct/quiz.questions.length)*100);
      app.innerHTML = `
        <div>
          <h2>結果</h2>
          <p>正解：<b>${correct}</b> / ${quiz.questions.length}（${rate}%）</p>
          <div class="row">
            <button class="smallbtn" onclick="restart()">もう一度</button>
          </div>
        </div>
      `;
      return;
    }

    // ★ シャッフル（1周内は固定／restartで再シャッフル）
    if(!q._orig){
      q._orig = { choices: q.choices.slice(), answerIndex: q.answerIndex };
    }
    if(!q._shuffled){
      const r = shuffleChoices(q._orig.choices, q._orig.answerIndex);
      q.choices = r.newChoices;
      q.answerIndex = r.newAnswerIndex;
      q._shuffled = true;
    }

    app.insertAdjacentHTML("beforeend", `
      <div>
        <div class="muted">${idx+1} / ${quiz.questions.length}　|　${safeText(q.section)}</div>
        <h2 style="margin:8px 0 10px">${safeText(q.question)}</h2>
      </div>
    `);

    q.choices.forEach((c, i) => {
      const b = document.createElement("button");
      b.textContent = `${i+1}. ${c}`;

      if(IS_VIEW){
        b.disabled = true;
        b.style.cursor = "default";
        b.style.opacity = "1";
      }else{
        b.onclick = () => choose(i, b);
      }
      app.appendChild(b);
    });

    app.insertAdjacentHTML("beforeend", `<div id="fb" class="card" style="display:none"></div>`);

    if(IS_VIEW){
      app.insertAdjacentHTML("beforeend", `
        <div class="row">
          <button class="smallbtn" id="show" onclick="toggleAnswer()">正解／解説を表示</button>
          <button class="smallbtn" onclick="prev()">前へ</button>
          <button class="smallbtn" onclick="next()">次へ</button>
        </div>
      `);
    }else{
      app.insertAdjacentHTML("beforeend", `
        <div class="row">
          <button class="smallbtn" id="next" style="display:none" onclick="next()">次へ</button>
        </div>
      `);
    }
  }

  function choose(i, btn){
    if(answered) return;
    answered = true;

    const q = quiz.questions[idx];
    const fb = document.getElementById("fb");
    const nextBtn = document.getElementById("next");

    const ok = (i === q.answerIndex);
    if(ok) correct++;

    if(ok) btn.classList.add("ok"); else btn.classList.add("ng");

    fb.style.display = "block";
    fb.innerHTML = `
      <h3 style="margin:0 0 6px">${ok ? "正解" : "不正解"}</h3>
      <p class="muted" style="margin:0 0 8px">正解：${q.answerIndex+1}. ${q.choices[q.answerIndex]}</p>
      <p style="margin:0">${safeText(q.explanation)}</p>
    `;
    if(nextBtn) nextBtn.style.display = "inline-block";
  }

  window.next = function(){ idx++; answered = false; render(); }
  window.prev = function(){ idx = Math.max(0, idx - 1); answered = false; render(); }
  window.restart = function(){
    idx = 0; correct = 0; answered = false;

    // ★ 全問リセット：次の周回で再シャッフル
    if(quiz && quiz.questions){
      quiz.questions.forEach(q=>{
        if(q && q._orig){
          q.choices = q._orig.choices.slice();
          q.answerIndex = q._orig.answerIndex;
        }
        if(q) q._shuffled = false;
      });
    }

    render();
  }

  window.toggleAnswer = function(){
    const q = quiz.questions[idx];
    const fb = document.getElementById("fb");
    const showBtn = document.getElementById("show");
    if(!fb || !q) return;

    const opened = (fb.style.display !== "none");
    if(opened){
      fb.style.display = "none";
      if(showBtn) showBtn.textContent = "正解／解説を表示";
      return;
    }

    fb.style.display = "block";
    fb.innerHTML = `
      <h3 style="margin:0 0 6px">正解</h3>
      <p class="muted" style="margin:0 0 8px">正解：${q.answerIndex+1}. ${q.choices[q.answerIndex]}</p>
      <p style="margin:0">${safeText(q.explanation)}</p>
    `;
    if(showBtn) showBtn.textContent = "正解／解説を隠す";
  }

  async function init(){
    try{
      const res = await fetch(DATA_URL, { cache: "no-store" });
      if(!res.ok) throw new Error(`fetch failed: ${res.status} ${res.statusText}`);
      quiz = await res.json();

      setPageTitle();
      setSubtitle();
      updateModeBar();
      render();
    }catch(e){
      console.error(e);
      if(subtitleEl) subtitleEl.textContent = "";
      if(app){
        app.innerHTML = `
          <div>
            <h2>読み込みエラー</h2>
            <p class="muted">quiz_preamble_8.json が見つからない／読めない可能性があります。</p>
            <p class="muted">同じ階層にファイルがあるか確認してください。</p>
          </div>
        `;
      }
    }
  }

  init();
  </script>
</body>
</html>
