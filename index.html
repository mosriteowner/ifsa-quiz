<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>#自主基準クイズ（前文）</title>
  <style>
    body{
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
      max-width:820px;
      margin:24px auto;
      padding:0 16px;
      line-height:1.6
    }
    .card{border:1px solid #ddd;border-radius:12px;padding:16px 18px;margin:12px 0}
    .muted{color:#666;font-size:0.92em}
    button{
      padding:10px 12px;
      border-radius:10px;
      border:1px solid #ccc;
      background:#fff;
      cursor:pointer;
      text-align:left;
      width:100%;
      margin:6px 0
    }
    button:hover{background:#f6f6f6}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .smallbtn{width:auto}
    .ok{border-color:#2f855a}
    .ng{border-color:#c53030}

    /* スマホ向け */
    @media (max-width: 480px) {
      button {
        font-size: 17px;
        line-height: 1.4;
        padding: 12px 10px;
      }
    }

    /* iPad / タブレット向け */
    @media (pointer: coarse) and (min-width: 768px) {
      button {
        font-size: 18px;
        line-height: 1.6;
        padding: 14px 12px;
      }
    }
  </style>
</head>

<body>
  <h1 id="title">#自主基準クイズ（前文）</h1>
  <p class="muted">学習用クイズ。全8問、1問ずつ進みます。</p>

  <div id="app" class="card"></div>

  <script>
    const DATA_URL = "./quiz_preamble_8.json";
    let quiz, idx = 0, correct = 0, answered = false;

    const el = (html) => {
      const d = document.createElement("div");
      d.innerHTML = html.trim();
      return d.firstChild;
    };
    const app = document.getElementById("app");
    const titleEl = document.getElementById("title");

    async function init(){
      const res = await fetch(DATA_URL, { cache: "no-store" });
      quiz = await res.json();

      const qt = (quiz && typeof quiz.title === "string") ? quiz.title.trim() : "";
      if(qt){
        document.title = `#自主基準クイズ（${qt}）`;
        if(titleEl) titleEl.textContent = `#自主基準クイズ（${qt}）`;
      }else{
        document.title = "#自主基準クイズ（前文）";
        if(titleEl) titleEl.textContent = "#自主基準クイズ（前文）";
      }
      render();
    }

    function render(){
      const q = quiz.questions[idx];
      app.innerHTML = "";
      if(!q){
        const rate = Math.round((correct/quiz.questions.length)*100);
        app.appendChild(el(`
          <div>
            <h2>結果</h2>
            <p>正解：<b>${correct}</b> / ${quiz.questions.length}（${rate}%）</p>
            <div class="row">
              <button class="smallbtn" onclick="restart()">もう一度</button>
            </div>
          </div>
        `));
        return;
      }

      app.appendChild(el(`
        <div>
          <div class="muted">${idx+1} / ${quiz.questions.length}　|　${q.section}</div>
          <h2 style="margin:8px 0 10px">${q.question}</h2>
        </div>
      `));

      q.choices.forEach((c, i) => {
        const b = document.createElement("button");
        b.textContent = `${i+1}. ${c}`;
        b.onclick = () => choose(i, b);
        app.appendChild(b);
      });

      app.appendChild(el(`<div id="fb" class="card" style="display:none"></div>`));
      app.appendChild(el(`
        <div class="row">
          <button class="smallbtn" id="next" style="display:none" onclick="next()">次へ</button>
        </div>
      `));
    }

    function choose(i, btn){
      if(answered) return;
      answered = true;
      const q = quiz.questions[idx];
      const fb = document.getElementById("fb");
      const nextBtn = document.getElementById("next");
      const ok = (i === q.answerIndex);
      if(ok) correct++;
      btn.classList.add(ok ? "ok" : "ng");
      fb.style.display = "block";
      fb.innerHTML = `
        <h3>${ok ? "正解" : "不正解"}</h3>
        <p class="muted">正解：${q.answerIndex+1}. ${q.choices[q.answerIndex]}</p>
        <p>${q.explanation}</p>
      `;
      nextBtn.style.display = "inline-block";
    }

    function next(){ idx++; answered = false; render(); }
    function restart(){ idx = 0; correct = 0; answered = false; render(); }

    init();
  </script>
</body>
</html>
