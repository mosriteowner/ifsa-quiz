<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>#自主基準クイズ</title>
  <style>
    body{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;max-width:820px;margin:24px auto;padding:0 16px;line-height:1.6}
    .card{border:1px solid #ddd;border-radius:12px;padding:16px 18px;margin:12px 0}
    .muted{color:#666;font-size:0.92em}
    button{padding:10px 12px;border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;text-align:left;width:100%;margin:6px 0}
    button:hover{background:#f6f6f6}
    .row{display:flex;gap:8px;flex-wrap:wrap}
    .smallbtn{width:auto}
    .ok{border-color:#2f855a}
    .ng{border-color:#c53030}

    @media (max-width: 480px) {
      button { font-size: 17px; line-height: 1.4; padding: 12px 10px; }
    }
    @media (pointer: coarse) and (min-width: 768px) {
      button { font-size: 18px; line-height: 1.6; padding: 14px 12px; }
    }

    button:disabled{
      color:#000;
      opacity:1;
      background:#fff;
      border-color:#ccc;
    }

    .modebar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 0}
    .modepill{width:auto}
  </style>
</head>
<body>
  <h1 id="title">#自主基準クイズ</h1>
  <p class="muted" id="subtitle">学習用クイズ。1問ずつ進みます。</p>

  <div class="modebar" id="modebar" style="display:none">
    <button class="smallbtn modepill" id="modeLabel" disabled>モード</button>
    <button class="smallbtn modepill" id="modeToggle" type="button">切替</button>
  </div>

  <div id="app" class="card"></div>

<script>
const params = new URLSearchParams(location.search);
const DATA_URL = params.get("data") || "./quiz_preamble_8.json";
const MODE = (params.get("mode") || "quiz").toLowerCase();
const IS_VIEW = (MODE === "view" || MODE === "read");

function setMode(newMode){
  const p = new URLSearchParams(location.search);
  if(newMode){ p.set("mode", newMode); } else { p.delete("mode"); }
  location.search = p.toString() ? ("?" + p.toString()) : "";
}
function toggleMode(){ setMode(IS_VIEW ? "quiz" : "view"); }

function updateModeBar(){
  const bar = document.getElementById("modebar");
  const label = document.getElementById("modeLabel");
  const toggle = document.getElementById("modeToggle");
  bar.style.display = "flex";
  label.textContent = IS_VIEW ? "閲覧モード" : "回答モード";
  toggle.textContent = IS_VIEW ? "回答へ切替" : "閲覧へ切替";
  toggle.onclick = toggleMode;
}

let quiz=null, headings=null, idx=0, correct=0, answered=false;
const MARU=[null,"①","②","③","④","⑤","⑥","⑦","⑧","⑨","⑩"];
const app=document.getElementById("app");
const titleEl=document.getElementById("title");
const subtitleEl=document.getElementById("subtitle");

function safeText(s){return String(s??"");}

/* ===== 追加：選択肢シャッフル ===== */
function shuffleChoices(choices, answerIndex){
  const packed = choices.map((text,i)=>({text,i}));
  for(let j=packed.length-1;j>0;j--){
    const k=Math.floor(Math.random()*(j+1));
    [packed[j],packed[k]]=[packed[k],packed[j]];
  }
  return {
    newChoices: packed.map(p=>p.text),
    newAnswerIndex: packed.findIndex(p=>p.i===answerIndex)
  };
}
/* ================================= */

function chapterFromDataUrl(){
  const m = DATA_URL.match(/quiz_ch(\d+)\.json/);
  return m ? parseInt(m[1],10) : null;
}
function getChapterTitle(ch){
  return headings?.chapters?.[String(ch)]?.title || "";
}
function getSectionTitle(ch,sec){
  return headings?.chapters?.[String(ch)]?.sections?.[String(sec)] || "";
}

function setPageTitle(){
  const ch = chapterFromDataUrl();
  if(ch && headings?.chapters?.[String(ch)]){
    const t = headings.chapters[String(ch)].title || "";
    const label = t ? `第${ch}章 ${t}` : `第${ch}章`;
    document.title = `#自主基準クイズ（${label}）`;
    titleEl.textContent = `#自主基準クイズ（${label}）`;
    return;
  }
  document.title="#自主基準クイズ";
  titleEl.textContent="#自主基準クイズ";
}
function setSubtitle(){
  subtitleEl.textContent = IS_VIEW
    ? "閲覧モード。必要に応じて正解／解説を表示します。"
    : "回答モード。1問ずつ進みます。";
}

function formatRefLabel(q){
  const r=q?.ref;
  if(r && Number.isInteger(r.chapter)){
    const ch=r.chapter;
    const chTitle=getChapterTitle(ch);
    let s=`第${ch}章`+(chTitle?` ${chTitle}`:"");
    if(ch===8||!Number.isInteger(r.section)){
      if(Number.isInteger(r.subsection)) s+=` (${r.subsection})`;
      if(Number.isInteger(r.item)) s+=` ${MARU[r.item]||""}`;
      return s.trim();
    }
    const sec=r.section;
    const secTitle=getSectionTitle(ch,sec);
    s+=` / ${sec}.`+(secTitle?` ${secTitle}`:"");
    if(Number.isInteger(r.subsection)) s+=` (${r.subsection})`;
    if(Number.isInteger(r.item)) s+=` ${MARU[r.item]||""}`;
    return s.trim();
  }
  return safeText(q?.section).trim();
}

function render(){
  const q = quiz.questions[idx];
  app.innerHTML="";

  if(!q){
    app.innerHTML=IS_VIEW
      ? `<h2>最後まで到達</h2><button onclick="restart()">最初へ</button>`
      : `<h2>結果</h2><p>正解 ${correct}/${quiz.questions.length}</p><button onclick="restart()">もう一度</button>`;
    return;
  }

  /* ★ シャッフル（1周内は固定／restartで再シャッフル） */
  if(!q._orig){
    q._orig = { choices: q.choices.slice(), answerIndex: q.answerIndex };
  }
  if(!q._shuffled){
    const r = shuffleChoices(q._orig.choices, q._orig.answerIndex);
    q.choices = r.newChoices;
    q.answerIndex = r.newAnswerIndex;
    q._shuffled = true;
  }

  app.insertAdjacentHTML("beforeend",`
    <div class="muted">${idx+1}/${quiz.questions.length} | ${formatRefLabel(q)}</div>
    <h2>${safeText(q.question)}</h2>
  `);

  q.choices.forEach((c,i)=>{
    const b=document.createElement("button");
    b.textContent=`${i+1}. ${c}`;
    if(IS_VIEW){ b.disabled=true; }
    else{ b.onclick=()=>choose(i,b); }
    app.appendChild(b);
  });

  app.insertAdjacentHTML("beforeend",`<div id="fb" class="card" style="display:none"></div>`);

  if(IS_VIEW){
    app.insertAdjacentHTML("beforeend",`
      <div class="row">
        <button class="smallbtn" onclick="toggleAnswer()">正解／解説</button>
        <button class="smallbtn" onclick="prev()">前へ</button>
        <button class="smallbtn" onclick="next()">次へ</button>
      </div>
    `);
  }else{
    app.insertAdjacentHTML("beforeend",`
      <div class="row">
        <button id="next" class="smallbtn" style="display:none" onclick="next()">次へ</button>
      </div>
    `);
  }
}

function choose(i,btn){
  if(answered) return;
  answered=true;
  const q=quiz.questions[idx];
  const fb=document.getElementById("fb");
  const ok=(i===q.answerIndex);
  if(ok) correct++;
  btn.classList.add(ok?"ok":"ng");
  fb.style.display="block";
  fb.innerHTML=`
    <h3>${ok?"正解":"不正解"}</h3>
    <p class="muted">正解：${q.answerIndex+1}. ${q.choices[q.answerIndex]}</p>
    <p>${safeText(q.explanation)}</p>
  `;
  const n=document.getElementById("next");
  if(n) n.style.display="inline-block";
}

function toggleAnswer(){
  const q=quiz.questions[idx];
  const fb=document.getElementById("fb");
  fb.style.display=fb.style.display==="none"?"block":"none";
  if(fb.style.display==="block"){
    fb.innerHTML=`
      <h3>正解</h3>
      <p class="muted">正解：${q.answerIndex+1}. ${q.choices[q.answerIndex]}</p>
      <p>${safeText(q.explanation)}</p>
    `;
  }
}

window.next=()=>{idx++;answered=false;render();}
window.prev=()=>{idx=Math.max(0,idx-1);answered=false;render();}
window.restart=()=>{
  idx=0;correct=0;answered=false;

  // ★ 全問リセット：次の周回で再シャッフル
  if(quiz && quiz.questions){
    quiz.questions.forEach(q=>{
      if(q && q._orig){
        q.choices = q._orig.choices.slice();
        q.answerIndex = q._orig.answerIndex;
      }
      if(q) q._shuffled = false;
    });
  }

  render();
}

async function init(){
  const r=await fetch(DATA_URL,{cache:"no-store"});
  quiz=await r.json();
  try{
    const h=await fetch("./ifsa_headings.json",{cache:"no-store"});
    if(h.ok) headings=await h.json();
  }catch{}
  setPageTitle(); setSubtitle(); updateModeBar(); render();
}
init();
</script>
</body>
</html>
